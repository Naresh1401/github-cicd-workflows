name: Check repositories

# Every day: find repositories that don't call these shared workflows yet. With the
# ONBOARDING_TOKEN secret it opens a pull request in each one; without it, it lists
# them in a tracking issue here. Repositories that already have their own ci.yml are
# listed for review and never changed.
on:
  schedule:
    - cron: "30 9 * * *"
  workflow_dispatch:
    inputs:
      dry-run:
        description: Inspect existing repositories without writing issues or PRs.
        type: boolean
        default: true
      open-prs:
        description: Propose onboarding/migration PRs (requires ONBOARDING_TOKEN and a v2 release).
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: check-repos
  cancel-in-progress: false

jobs:
  security:
    uses: ./.github/workflows/security.yml

  check:
    needs: security
    permissions:
      contents: read
      issues: write
    name: Find repositories without the shared CI
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r scripts/requirements.txt

      - name: Check repositories
        env:
          GH_TOKEN: ${{ secrets.ONBOARDING_TOKEN || github.token }}
          OPEN_PRS: ${{ secrets.ONBOARDING_TOKEN != '' && (inputs.open-prs || (github.event_name == 'schedule' && vars.ENABLE_SECURITY_ONBOARDING == 'true')) }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry-run }}
          OWNER: ${{ github.repository_owner }}
          THIS_REPO: ${{ github.repository }}
        run: python scripts/onboard.py
