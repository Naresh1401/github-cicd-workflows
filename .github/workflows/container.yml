name: Container

on:
  workflow_call:
    inputs:
      context:
        description: Build context, relative to the repository root.
        type: string
        default: "."
      dockerfile:
        description: Path to the Dockerfile, relative to the repository root.
        type: string
        default: Dockerfile
      build-args:
        description: Build arguments, one KEY=value per line.
        type: string
        default: ""
      version-build-arg:
        description: Name of a build argument that receives the commit SHA, for example APP_VERSION.
        type: string
        default: ""
      smoke-test:
        description: Start the image and wait until its health endpoint answers.
        type: boolean
        default: false
      port:
        description: Port the container listens on.
        type: number
        default: 8000
      health-path:
        description: Path of the health endpoint.
        type: string
        default: /health
      expect-version:
        description: Fail the smoke test unless the health response's "version" field is the commit SHA.
        type: boolean
        default: false
      container-env:
        description: Environment variables for the smoke-test container, one KEY=value per line.
        type: string
        default: ""
      require-non-root:
        description: Fail when the image runs as root.
        type: boolean
        default: false
      scan:
        description: >-
          report: list fixable high and critical vulnerabilities in the image without failing.
          enforce: fail on them. off: skip the scan.
        type: string
        default: enforce

permissions:
  contents: read

jobs:
  security:
    uses: ./.github/workflows/security.yml

  image:
    needs: security
    name: Build ${{ inputs.dockerfile }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    env:
      IMAGE: ci-image:${{ github.sha }}
    steps:
      - name: Check inputs
        env:
          SCAN: ${{ inputs.scan }}
        run: |
          case "$SCAN" in
            report|enforce|off) ;;
            *) echo "::error::scan must be report, enforce or off (got '$SCAN')"; exit 1 ;;
          esac

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Collect build arguments
        id: args
        env:
          BUILD_ARGS: ${{ inputs.build-args }}
          VERSION_ARG: ${{ inputs.version-build-arg }}
          DOCKERFILE: ${{ inputs.dockerfile }}
        run: |
          {
            echo "build-args<<EOF"
            if [ -n "$BUILD_ARGS" ]; then printf '%s\n' "$BUILD_ARGS"; fi
            if [ -n "$VERSION_ARG" ]; then echo "${VERSION_ARG}=${GITHUB_SHA}"; fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          # One build cache per Dockerfile, so repositories with several images don't evict each other
          echo "cache-scope=$(printf '%s' "$DOCKERFILE" | tr -c 'A-Za-z0-9._-' '-')" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          load: true
          tags: ${{ env.IMAGE }}
          build-args: ${{ steps.args.outputs.build-args }}
          cache-from: type=gha,scope=${{ steps.args.outputs.cache-scope }}
          cache-to: type=gha,mode=max,scope=${{ steps.args.outputs.cache-scope }},ignore-error=true

      - name: Smoke test
        if: inputs.smoke-test
        env:
          PORT: ${{ inputs.port }}
          HEALTH_PATH: ${{ inputs.health-path }}
          EXPECT_VERSION: ${{ inputs.expect-version }}
          CONTAINER_ENV: ${{ inputs.container-env }}
        run: |
          printf '%s\n' "$CONTAINER_ENV" | sed '/^[[:space:]]*$/d' > "$RUNNER_TEMP/container.env"
          docker run --detach --name smoke --env-file "$RUNNER_TEMP/container.env" \
            --publish "127.0.0.1:${PORT}:${PORT}" "$IMAGE"
          trap 'docker rm --force smoke >/dev/null 2>&1 || true' EXIT
          for _ in $(seq 1 60); do
            if body="$(curl --fail --silent --max-time 5 "http://127.0.0.1:${PORT}${HEALTH_PATH}")"; then
              if [ "$EXPECT_VERSION" = true ]; then
                version="$(jq -r '.version // empty' <<<"$body")"
                if [ "$version" != "$GITHUB_SHA" ]; then
                  echo "::error::The image reports version '${version}', expected ${GITHUB_SHA}"
                  exit 1
                fi
              fi
              echo "Healthy: ${body}"
              exit 0
            fi
            if [ "$(docker inspect --format '{{.State.Running}}' smoke)" != true ]; then
              docker logs smoke
              echo "::error::The container exited before its health endpoint answered"
              exit 1
            fi
            sleep 1
          done
          docker logs smoke
          echo "::error::${HEALTH_PATH} did not answer on port ${PORT} within 60 seconds"
          exit 1

      - name: Check the image runs as a non-root user
        if: inputs.require-non-root
        run: |
          user="$(docker image inspect --format '{{.Config.User}}' "$IMAGE")"
          case "${user%%:*}" in
            ""|root|0) echo "::error::The image runs as root; add a USER instruction"; exit 1 ;;
          esac
          echo "Runs as ${user}"

      - name: Scan the image
        if: inputs.scan != 'off'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.75.0
          image-ref: ${{ env.IMAGE }}
          severity: CRITICAL,HIGH
          ignore-unfixed: false
          format: json
          output: ${{ runner.temp }}/image-scan.json
          exit-code: ${{ inputs.scan == 'enforce' && '1' || '0' }}

      - name: Report scan findings
        if: always() && inputs.scan != 'off'
        run: |
          results="$RUNNER_TEMP/image-scan.json"
          if [ ! -s "$results" ]; then exit 0; fi
          count="$(jq '[.Results[]?.Vulnerabilities[]?] | length' "$results")"
          if [ "$count" -eq 0 ]; then
            echo "No high or critical vulnerabilities."
            exit 0
          fi
          {
            echo "### Image scan: ${count} high or critical vulnerabilities"
            echo
            echo "| Package | Vulnerability | Severity | Installed | Fixed in |"
            echo "|---|---|---|---|---|"
            jq -r '.Results[]?.Vulnerabilities[]? | "| \(.PkgName) | \(.VulnerabilityID) | \(.Severity) | \(.InstalledVersion) | \(.FixedVersion // "") |"' "$results"
          } | tee -a "$GITHUB_STEP_SUMMARY"
          echo "::warning::The image has ${count} high or critical vulnerabilities; see the job summary."
