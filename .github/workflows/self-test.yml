name: Self-test

# Runs every reusable workflow against the sample projects in tests/fixtures
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: self-test-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  security-contracts:
    name: Security and release regression tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install test tools
        run: |
          python -m pip install --require-hashes -r scripts/requirements.txt
          python -m pip install pytest==8.4.2 ruff==0.17.0
      - name: Run security and release regression tests
        run: python -m pytest scripts -q
      - name: Check script lint and formatting
        run: |
          python -m ruff check scripts
          python -m ruff format --check scripts
      - name: Explain formatting failures
        if: failure()
        run: |
          status=0
          python -m ruff format --diff scripts || status=$?
          if [ "$status" -gt 1 ]; then exit "$status"; fi

  python-requirements:
    name: Python (requirements.txt)
    uses: ./.github/workflows/python-ci.yml
    with:
      working-directory: tests/fixtures/python-requirements
      lint: full
      audit: enforce

  python-package:
    name: Python (pyproject package)
    uses: ./.github/workflows/python-ci.yml
    with:
      working-directory: tests/fixtures/python-package
      python-version: "3.13"
      lint: check
      env-vars: |
        GREETING=Hello

  python-no-tests:
    name: Python (no dependencies, no tests)
    uses: ./.github/workflows/python-ci.yml
    with:
      working-directory: tests/fixtures/python-no-tests

  node:
    name: Node
    strategy:
      matrix:
        node-version: ["20", "22"]
    uses: ./.github/workflows/node-ci.yml
    with:
      working-directory: tests/fixtures/node
      node-version: ${{ matrix.node-version }}
      audit: enforce

  container:
    name: Container
    uses: ./.github/workflows/container.yml
    with:
      context: tests/fixtures/container
      dockerfile: tests/fixtures/container/Dockerfile
      version-build-arg: APP_VERSION
      smoke-test: true
      expect-version: true
      require-non-root: true

  pnpm:
    name: pnpm
    strategy:
      matrix:
        node-version: ["20", "22"]
    uses: ./.github/workflows/node-ci.yml
    with:
      working-directory: tests/fixtures/pnpm
      node-version: ${{ matrix.node-version }}
      audit: enforce

  iac:
    name: Infrastructure as code
    uses: ./.github/workflows/iac.yml
    with:
      directories: '["tests/fixtures/iac"]'

  repo-lint:
    name: Repository lint
    uses: ./.github/workflows/repo-lint.yml
    with:
      workflow-shellcheck: true
      shellcheck-severity: style
      hadolint-threshold: style

  helm:
    name: Helm
    uses: ./.github/workflows/helm.yml
    with:
      chart: tests/fixtures/helm
      values-files: |
        values-ha.yaml
        values-kind.yaml
        values-ha.yaml values-kind.yaml
      kind-test: true
      setup-manifests: tests/fixtures/kind-setup.yaml
      install-values-files: values-kind.yaml
      image-dockerfile: tests/fixtures/container/Dockerfile
      image-context: tests/fixtures/container
      version-build-arg: APP_VERSION
      expect-version: true

  onboarding-script:
    name: Repository check script
    uses: ./.github/workflows/python-ci.yml
    with:
      working-directory: scripts
      lint: full
